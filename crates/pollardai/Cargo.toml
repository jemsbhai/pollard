[package]
name = "pollardai"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Native Rust runtime for Pollard governed execution trees, shared budgets, and verified replay"
license = "MIT"
repository = "https://github.com/jemsbhai/pollard"
homepage = "https://github.com/jemsbhai/pollard"
documentation = "https://docs.rs/pollardai"
readme = "README.md"
keywords = ["ai", "agents", "replay", "governance", "audit"]
categories = ["development-tools", "data-structures"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
# serde_json's insertion-order maps must also resolve on the declared Rust 1.74 MSRV.
indexmap = "=2.11.4"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = { version = "1.36", default-features = false, features = ["std"] }
postgres = { version = "=0.19.9", optional = true }
tokio-postgres = { version = "=0.7.12", optional = true }
postgres-types = { version = "=0.2.8", optional = true }
postgres-protocol = { version = "=0.6.8", optional = true }
rdkafka = { version = "=0.39.0", default-features = false, features = ["cmake-build"], optional = true }
rdkafka-sys = { version = "=4.10.0", default-features = false, optional = true }
openssl-sys = { version = "=0.9.111", optional = true }
futures-executor = { version = "0.3", optional = true }
redis = { version = "=0.25.4", default-features = false, optional = true }
native-tls = { version = "=0.2.12", optional = true }
url = { version = "=2.5.0", optional = true }
mongodb = { version = "=2.8.2", default-features = false, features = ["tokio-sync"], optional = true }
neo4j-driver = { package = "neo4j", version = "=0.2.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
time = { version = "=0.3.36", optional = true }
nvml-wrapper = { version = "=0.10.0", optional = true }
tiktoken-rs = { version = "=0.6.0", optional = true }
zeroize = { version = "=1.8.1", optional = true }
uuid = { version = "=1.8.0", optional = true }
jobserver = { version = "=0.1.32", optional = true }
powerfmt = { version = "=0.2.0", optional = true }

# Cargo 1.74 resolves weak optional rust_decimal dependencies even when they are
# not compiled. Keep their manifests readable by that Cargo version without
# enabling additional serializers or adding runtime dependencies.
[target.'cfg(any())'.dependencies]
borsh = { version = "=1.5.7", default-features = false }
proc-macro-crate = "=3.1.0"

[target.'cfg(windows)'.dependencies]
ipconfig = { version = "=0.3.2", optional = true }

[features]
default = []
postgres = ["dep:postgres", "dep:tokio-postgres", "dep:postgres-types", "dep:postgres-protocol"]
kafka = ["dep:rdkafka", "dep:rdkafka-sys", "dep:futures-executor"]
kafka-tls = ["kafka", "rdkafka/ssl-vendored", "dep:openssl-sys"]
redis = ["dep:redis", "dep:url"]
redis-tls = ["redis", "redis/tls-native-tls", "dep:native-tls"]
mongodb = ["dep:mongodb", "dep:tokio", "dep:time", "dep:url", "dep:uuid", "dep:zeroize", "dep:ipconfig", "dep:powerfmt"]
neo4j = ["dep:neo4j-driver", "dep:zeroize", "dep:jobserver"]
nvml = ["dep:nvml-wrapper"]
estimate-openai = ["dep:tiktoken-rs"]

[dev-dependencies]
futures = "0.3"

[lints.rust]
unsafe_code = "forbid"
