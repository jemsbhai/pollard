[package]
name = "pollardai"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Experimental native Rust core for Pollard governed execution trees and verified replay"
license = "MIT"
repository = "https://github.com/jemsbhai/pollard"
homepage = "https://github.com/jemsbhai/pollard"
documentation = "https://docs.rs/pollardai"
readme = "README.md"
keywords = ["ai", "agents", "replay", "governance", "audit"]
categories = ["development-tools", "data-structures"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
