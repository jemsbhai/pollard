name: Native core validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Python compatibility fixtures
        run: python interop/generate_vectors.py --check --check-packages
      - name: Python release behavior fixtures
        run: python interop/generate_npm_parity.py --check

  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20", "24"]
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install Node 24 compatible SQLite driver
        if: matrix.node == '24'
        run: npm install --no-save --package-lock=false better-sqlite3@13.0.3
      - run: npm test
      - run: npm pack --dry-run
      - run: npm run smoke:pack

  node-remote:
    name: Native Node distributed stores
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - run: npm ci
      - name: Install Node 24 compatible SQLite driver
        run: npm install --no-save --package-lock=false better-sqlite3@13.0.3
      - run: npm run test:remote

  rust:
    name: Rust ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: "1.74"
    defaults:
      run:
        working-directory: crates/pollardai
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked
      - run: cargo package --locked

  rust-python-interop:
    name: Rust and Python release 1.6.0 interchange on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Download pinned release oracle
        run: >-
          python -m pip download --no-deps --only-binary=:all:
          pollard==1.6.0 --dest .benchmarks/python-oracle
      - name: Verify SQLite and seal interchange
        run: >-
          python evidence/rust-parity-1.6.0/sqlite_interop.py
          --wheel .benchmarks/python-oracle/pollard-1.6.0-py3-none-any.whl
          --crate crates/pollardai --output-dir .benchmarks/sqlite-interop
      - name: Verify shared reservation interchange
        run: >-
          python evidence/rust-parity-1.6.0/arbitration_interop.py
          --wheel .benchmarks/python-oracle/pollard-1.6.0-py3-none-any.whl
          --crate crates/pollardai --output-dir .benchmarks/arbitration-interop
      - name: Verify mixed runtime enforcement
        run: >-
          python evidence/rust-parity-1.6.0/runtime_interop.py
          --wheel .benchmarks/python-oracle/pollard-1.6.0-py3-none-any.whl
          --crate crates/pollardai --output-dir .benchmarks/runtime-interop

  rust-optional-features:
    name: Optional native backends and TLS on Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.74"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Native TLS and Kafka build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev perl
      - name: Strict optional-feature lint
        run: cargo clippy --manifest-path crates/pollardai/Cargo.toml --locked --all-features --all-targets -- -D warnings
      - name: Optional-feature unit and fault tests
        run: cargo test --manifest-path crates/pollardai/Cargo.toml --locked --all-features --all-targets

  rust-fresh-consumer:
    name: Fresh Rust 1.74 consumer (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        features: [default, all]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.74.0"
      - name: Native build prerequisites
        if: matrix.features == 'all'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev perl
      - name: Resolve and run a new downstream application
        run: >-
          python evidence/rust-parity-1.6.0/validate_consumer.py
          --toolchain 1.74.0 --output-dir .benchmarks/fresh-consumer
          ${{ matrix.features == 'all' && '--all-features' || '' }}
      - name: Preserve fresh resolution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-fresh-consumer-${{ matrix.features }}
          include-hidden-files: true
          path: |
            .benchmarks/fresh-consumer/summary.json
            .benchmarks/fresh-consumer/*.log
            .benchmarks/fresh-consumer/Cargo.toml
            .benchmarks/fresh-consumer/Cargo.lock

  rust-live-remotes:
    name: Live native backends and Python release 1.6.0 interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev perl
      - name: Disposable-service ownership and failure guards
        run: python -m unittest discover -s evidence/rust-parity-1.6.0 -p test_validate_remote.py -v
      - name: Validate isolated PostgreSQL, Redis, Kafka, MongoDB and Neo4j
        run: python evidence/rust-parity-1.6.0/validate_remote.py --output-dir .benchmarks/remote-validation --python-source src
      - name: Preserve live validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-live-remote-validation
          include-hidden-files: true
          path: |
            .benchmarks/remote-validation/summary.json
            .benchmarks/remote-validation/python-environment.json
            .benchmarks/remote-validation/logs/*.log
            .benchmarks/remote-validation/results/*.json
